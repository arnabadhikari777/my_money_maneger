{% extends "base.html" %}
{% block content %}
<div class="section-title" style="margin-top:0;">
  <span>Categories</span>
  <a href="{{ url_for('main.category_add') }}">+ Add</a>
</div>
<div class="grid-2">
  {% for c in categories %}
  <div class="card category-tile">
    <div class="cat-name">{{ c.name }}</div>
    <div class="cat-total">{{ totals.get(c.id, 0) | inr }}</div>
    <div class="li-sub">spent this month</div>
    <div class="cat-actions">
      <a href="{{ url_for('main.category_detail', category_id=c.id) }}">View</a>
      <a href="{{ url_for('main.add_expense', category_id=c.id) }}">Add</a>
    </div>
  </div>
  {% else %}
  <div class="card empty-state">No categories yet.</div>
  {% endfor %}
</div>
{% endblock %}
